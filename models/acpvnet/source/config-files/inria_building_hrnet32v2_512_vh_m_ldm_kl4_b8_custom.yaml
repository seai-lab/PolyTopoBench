SOLVER:
  IMS_PER_BATCH: 8
  CHECKPOINT_PERIOD: 5000

  BASE_LR: 6e-5
  BACKBONE_LR_MULT: 1.0
  LR_SCHEDULER: 'linear_poly'
  WARMUP_ITERS: 4000
  TOTAL_ITERS: 400000
  POLY_POWER: 1.0
  ETA_MIN: 0.0

  OPTIMIZER: "ADAMW"
  BETAS: (0.9, 0.999)
  WEIGHT_DECAY: 0.01

USE_EMA: False
EMA_DECAY: 0.9999
EMA_USE_NUM_UPDATES: True
DDPM_TIMESTEPS: 800

DATALOADER:
  NUM_WORKERS: 8

DATASETS:
  IMAGE:
    PIXEL_MEAN: [109.730, 103.832, 98.681]
    PIXEL_STD: [22.275, 22.124, 23.229]
    TO_255: True
    HEIGHT: 512
    WIDTH: 512
  TARGET:
    HEIGHT: 128
    WIDTH: 128
  ORIGIN:
    HEIGHT: 512
    WIDTH: 512
  TRAIN: ("custom_acpv_train_with_latent_vertex_heatmap",)
  VAL: ("custom_acpv_val_with_latent_vertex_heatmap",)
  TEST: ("custom_acpv_test_with_latent_vertex_heatmap",)
  FACTORY: 'LatentVertexHeatmapTrainDataset'
  NUM_CLASSES: 2
  AUGMENTATIONS: ['rot0']

MODEL:
  NAME: "HRNet32v2"

  DECODE_HEAD:
    IN_CHANNELS: [32, 64, 128, 256]
    IN_INDEX: [0, 1, 2, 3]
    POOL_SCALES: [1, 2, 3, 6]
    CHANNELS: 512
    DROPOUT_RATIO: 0.1
    NUM_CLASSES: 2
    ALIGN_CORNERS: False

  AUX_HEAD:
    IN_CHANNELS: 128
    IN_INDEX: 2
    CHANNELS: 256
    NUM_CONVS: 1
    CONCAT_INPUT: False
    DROPOUT_RATIO: 0.1
    NUM_CLASSES: 2
    ALIGN_CORNERS: False

  unet_config:
    target: topomapper.modules.diffusionmodules.openaimodel.UNetModel
    params:
      image_size: 128
      out_channels: 3
      in_channels: 640
      model_channels: 128
      attention_resolutions:
        - 8
        - 4
      num_res_blocks: 1
      channel_mult:
        - 1
        - 2
        - 2
      num_head_channels: 32

  conditioning_key: "concat"

  LOSS_WEIGHTS:
    loss_vertex_heatmap_l1: 10.0
    loss_mask: 1.0
    loss_mask_aux: 0.4

OUTPUT_DIR: "../../output/acpvnet/inria_512/default"
