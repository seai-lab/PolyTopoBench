_BASE_: "Base-SparseRCNN.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  SparseRCNN:
    NUM_PROPOSALS: 160
    NUM_CLASSES: 1
DATASETS:
  TRAIN: ("deventer_train",)
  TEST: ("deventer_val",)
SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.000025
  STEPS: (27090, 33198)
  MAX_ITER: 36120
  CHECKPOINT_PERIOD: 1505
INPUT:
  MIN_SIZE_TRAIN: (512,)
  MAX_SIZE_TRAIN: 512
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 512
  CROP:
    ENABLED: False
  FORMAT: "RGB"
TEST:
  EVAL_PERIOD: 1505
DATALOADER:
  NUM_WORKERS: 4
OUTPUT_DIR: "output/sparsercnn/deventer_512_valtest_as_val/road/res50_160pro_512"
