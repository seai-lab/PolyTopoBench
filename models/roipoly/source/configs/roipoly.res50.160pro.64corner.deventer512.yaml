_BASE_: "Base-RoIPoly.yaml"
DATALOADER:
  NUM_WORKERS: 16
  FILTER_EMPTY_ANNOTATIONS: True
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  RoIPoly:
    NUM_PROPOSALS: 160
    NUM_CORNERS: 64
    NUM_CLASSES: 1
DATASETS:
  TRAIN: ("deventer_train",)
  TEST: ()
SOLVER:
  BASE_LR: 0.000025
  WEIGHT_DECAY: 0.0001
  BACKBONE_MULTIPLIER: 1.0
  OPTIMIZER: "ADAMW"
  IMS_PER_BATCH: 8
  STEPS: (90300,)
  MAX_ITER: 135450
  CHECKPOINT_PERIOD: 6020
TEST:
  EVAL_PERIOD: 999999999
INPUT:
  CROP:
    ENABLED: False
  FORMAT: "RGB"
OUTPUT_DIR: "output/roipoly/deventer_512_valtest_as_val/road/res50_160pro_64corner"
